server:
  port: 7000

spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: customer-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/v1/customers/**
        - id: cake-service
          uri: http://localhost:8001
          predicates:
            - Path=/api/v1/cakes/**
        - id: order-service
          uri: http://localhost:8002
          predicates:
            - Path=/api/v1/orders/**

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:9001/eureka/
